# ChatRouter configuration example.
# Copy to config/config.yaml and adjust for your environment.
# ${VAR} and ${VAR:-default} are expanded from the process environment.

server:
  host: 0.0.0.0
  port: 8000
  require_auth: true
  admin_api_key_env: CHATROUTER_ADMIN_KEY
  cors_origins: []

storage:
  # "memory" is single-process only; use "redis" for multi-replica deployments.
  backend: ${CHATROUTER_STORAGE:-memory}
  redis_url: ${REDIS_URL:-redis://localhost:6379/0}
  key_prefix: chatrouter

observability:
  metrics_enabled: true
  metrics_path: /metrics
  log_level: ${LOG_LEVEL:-INFO}
  log_json: true
  log_request_bodies: false

routing:
  default_model: gpt-4o-mini
  quality_bias: 0.6      # 0 = cheapest, 1 = best quality
  latency_bias: 0.15
  allow_upgrade: true
  allow_downgrade: true
  respect_explicit_model: true
  auto_model_aliases: [auto, chatrouter-auto]

  thresholds:
    economy_max: 0.25
    standard_max: 0.55
    premium_max: 0.80

  # What to do when a conversation outgrows every model's context window.
  #   reject         - fail fast with HTTP 400
  #   largest_window - route to the widest-window model (default)
  #   trim_history   - drop middle turns to make it fit (lossy)
  context_overflow:
    strategy: largest_window
    trim_target_ratio: 0.7       # share of the window the prompt may occupy
    keep_leading_messages: 1     # never drop the system prompt
    keep_trailing_messages: 4    # never drop the current question
    insert_elision_notice: true  # tell the model that history was removed

  # Cache identical non-streaming completions to avoid duplicate upstream calls.
  # A hit requires every output-affecting field to match exactly; streaming and
  # session-scoped requests are always bypassed. Enable to cut cost on repeated
  # prompts (e.g. health checks, identical eval inputs).
  response_cache:
    enabled: false
    ttl_seconds: 300
    bypass_hints: [session_id]   # skip cache when multi-turn state is present
    excluded_tenants: []         # tenants that must always reach the model


  context:
    enabled: true
    max_messages_analysed: 40
    recency_decay: 0.85
    escalation_memory: 0.6
    context_pressure_threshold: 0.35
    signal_weights:
      conversation_depth: 1.0
      context_length: 1.0
      reasoning_keywords: 1.5
      code_content: 1.2
      structured_output: 0.8
      tool_usage: 1.0
      multilingual: 0.5
      unresolved_thread: 1.3
      instruction_density: 0.9
      requested_output_size: 0.7

  # Keep a multi-turn conversation on the same model so the upstream prefix
  # cache stays hot. Switching models mid-session throws that cache away (a
  # 75–90% input-cost saving), which usually outweighs the routing saving.
  session_affinity:
    enabled: true
    # Scale applied to the *real* switch penalty, which is now the business cost
    # of forfeiting the session's upstream prefix cache (SeqRoute, arXiv 2026):
    #   penalty_usd = historical_prefix_tokens * (c_in - c_cache)
    # The gateway converts that USD loss into its utility score via a single
    # constant (_SWITCH_PENALTY_USD_PER_UTILITY). 0 disables affinity; 1 applies
    # the exact business cost; >1 amplifies it. The longer the conversation and
    # the pricier the model's cache, the stronger the pull to stay put.
    stickiness: 0.4
    max_drift_tiers: 1     # allow switching only when task drifts this many tiers
    ttl_seconds: 1800      # forget the sticky model after this idle period

  feedback:
    enabled: true
    ema_alpha: 0.1
    min_samples: 20
    learning_rate: 0.3
    exploration_ratio: 0.05
    window_seconds: 3600
    degraded_success_rate: 0.85
    treat_retry_as_negative: true
    treat_truncation_as_negative: true
    # How heterogeneous feedback collapses into one [0,1] quality score.
    #   score   - used verbatim, no remap
    #   rating  - 1->0.0 .. 5->1.0 (linear)
    #   thumb   - up/down map directly to the two scores below
    #   accepted- accept/reject map to the two scores below
    #   regenerated / edited - behavioural weak signals, last-resort fallbacks
    normalization:
      thumb_up_score: 1.0
      thumb_down_score: 0.0
      accept_score: 1.0
      reject_score: 0.0
      regenerated_score: 0.2
      edited_score: 0.5

resilience:
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    failure_rate_threshold: 0.5
    min_requests: 10
    open_seconds: 30
    half_open_max_calls: 3
    window_seconds: 60
  retry:
    max_attempts: 3
    enable_model_failover: true
    backoff_base_seconds: 0.25
    backoff_max_seconds: 4.0
    retry_on_status: [408, 409, 425, 429, 500, 502, 503, 504]
    retry_streaming_before_first_chunk: true
  overflow:
    enabled: true
    saturation_threshold: 0.85
    queue_enabled: true
    queue_max_wait_seconds: 5.0
    queue_max_depth: 500
    allow_cross_tier_overflow: true

providers:
  - name: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 120
    max_connections: 200

  - name: deepseek
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    timeout_seconds: 180

  - name: local-vllm
    base_url: ${VLLM_BASE_URL:-http://localhost:8001/v1}
    api_key_env: VLLM_API_KEY
    timeout_seconds: 120

models:
  - id: qwen2.5-7b
    provider: local-vllm
    upstream_model: Qwen/Qwen2.5-7B-Instruct
    tier: economy
    input_cost_per_1k: 0.0
    output_cost_per_1k: 0.0
    context_window: 32768
    quality_prior: 0.45
    latency_prior_ms: 700
    max_concurrency: 64
    tags: [self-hosted]

  - id: gpt-4o-mini
    provider: openai
    upstream_model: gpt-4o-mini
    tier: standard
    input_cost_per_1k: 0.00015
    output_cost_per_1k: 0.0006
    cached_input_cost_per_1k: 0.000075   # OpenAI cache-read ≈ 50% of input
    context_window: 128000
    max_output_tokens: 16384
    supports_vision: true
    quality_prior: 0.68
    latency_prior_ms: 1200
    max_rpm: 5000
    max_tpm: 4000000

  - id: gpt-4o
    provider: openai
    upstream_model: gpt-4o
    tier: premium
    input_cost_per_1k: 0.0025
    output_cost_per_1k: 0.01
    cached_input_cost_per_1k: 0.00125   # OpenAI cache-read ≈ 50% of input
    context_window: 128000
    max_output_tokens: 16384
    supports_vision: true
    quality_prior: 0.85
    latency_prior_ms: 2200
    max_rpm: 3000
    max_tpm: 2000000

  - id: deepseek-reasoner
    provider: deepseek
    upstream_model: deepseek-reasoner
    tier: reasoning
    input_cost_per_1k: 0.00055
    output_cost_per_1k: 0.00219
    cached_input_cost_per_1k: 0.000055   # DeepSeek cache hit ≈ 10% of input
    context_window: 65536
    max_output_tokens: 8192
    supports_tools: false
    quality_prior: 0.90
    latency_prior_ms: 9000
    max_rpm: 500
    tags: [chain-of-thought]

tenants:
  - id: default
    name: Default tenant
    api_keys:
      - ${CHATROUTER_DEFAULT_KEY:-sk-chatrouter-dev}
    rate_limit:
      rpm: 600
      tpm: 1000000
      max_concurrency: 64
    quota:
      period: day
      max_tokens: 50000000
      max_cost_usd: 200
      on_exceed: downgrade

  - id: free-tier
    name: Free tier
    api_keys:
      - ${CHATROUTER_FREE_KEY:-sk-chatrouter-free}
    rate_limit:
      rpm: 60
      tpm: 60000
      max_concurrency: 8
    quota:
      period: day
      max_requests: 1000
      max_cost_usd: 1
      on_exceed: reject
    max_tier: standard
    quality_bias: 0.3
