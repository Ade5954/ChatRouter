# Round-robin load balancing across ChatRouter replicas.
#
# Mounted into the nginx container by docker-compose.replicas.yml. Keep this
# minimal: the replicas are stateless from the client's point of view (all
# shared state lives in Redis), so plain round-robin without sticky sessions
# is correct.

upstream chatrouter_replicas {
    # least_conn would be slightly smarter under uneven request latencies,
    # but round-robin is deterministic and easier to reason about during
    # multi-replica tests. Switch to least_conn in production.
    server replica-1:8000 max_fails=3 fail_timeout=10s;
    server replica-2:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 8000;

    # Thin health endpoint for the load balancer itself: any 2xx from either
    # replica means the cluster is serving. nginx will 502 if both backends
    # are down.
    location = /lb-health {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    # All real traffic — chat completions, admin, metrics, web UI — goes to
    # the upstream pool. SSE streaming is pass-through; we disable buffering
    # so streamed chat completions reach the client chunk-by-chunk instead
    # of being held until the response completes.
    location / {
        proxy_pass http://chatrouter_replicas;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streaming: disable buffering and lengthen timeouts so long-running
        # completions and SSE streams are not cut off.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
