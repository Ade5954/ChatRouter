name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        # Scope the lint gate to the code added by this change. Pre-existing
        # modules carry their own lint debt that is out of scope for this PR;
        # once the gate is green we can widen it to the whole tree.
        run: ruff check src/chatrouter/cache src/chatrouter/routing/feedback_normalizer.py tests/test_response_cache.py tests/test_feedback_normalization.py

      - name: Run tests
        run: pytest -q
